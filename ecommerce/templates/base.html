{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>MyStore</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/">MyStore</a>

        <!-- Toggle button (mobile) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar content -->
        <div class="collapse navbar-collapse" id="navbarContent">

            <!-- Search -->
            <form method="GET" action="/" class="d-flex ms-auto me-3">
                <input class="form-control me-2" type="search" name="q"
                       placeholder="Search products...">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>

            <!-- Cart -->
            <a href="/cart/" class="btn btn-warning">
                Cart ({{ request.user.order_set.first.orderitem_set.count|default:0 }})
            </a>

        </div>
    </div>
</nav>

<!-- Messages (outside navbar) -->
{% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="alert alert-success text-center shadow-sm">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}

<!-- Main Content -->
<div class="container mt-4 main-content shadow-sm">
        {% block content %}
    {% endblock %}
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 MyStore | Built with Django & Bootstrap</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
