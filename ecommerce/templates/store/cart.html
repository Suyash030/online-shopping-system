{% extends 'base.html' %}
{% block content %}

<h2>Your Cart</h2>

<table class="table">
<tr>
    <th>Product</th>
    <th>Quantity</th>
    <th>Total</th>
    <th>Action</th>
</tr>

{% for item in items %}
<tr>
    <td>{{ item.product.name }}</td>
    <td>{{ item.quantity }}</td>
    <td>${{ item.get_total }}</td>
    <td>
        <a href="{% url 'add_to_cart' item.product.id %}" class="btn btn-sm btn-success">+</a>
        <a href="{% url 'remove_from_cart' item.product.id %}" class="btn btn-sm btn-danger">-</a>
    </td>
</tr>
{% endfor %}
</table>
<a href="{% url 'checkout' %}" class="btn btn-success">
    Checkout
</a>
<h4>Total Cart Price: ${{ order.get_cart_total }}</h4>

{% endblock %}
