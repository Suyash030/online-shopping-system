{% extends 'base.html' %}
{% block content %}

<div class="row">

    <!-- Sidebar -->
    <div class="col-md-3">
        <div class="card">
            <div class="card-header bg-dark text-white">
                Categories
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">
                    <a href="/" class="text-decoration-none">All Products</a>
                </li>
                {% for cat in categories %}
                <li class="list-group-item">
                    <a href="?category={{ cat.id }}" class="text-decoration-none">
                        {{ cat.name }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <!-- Products -->
    <div class="col-md-9">
        <div class="row">

            {% for product in products %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm product-card">
                    <img src="{{ product.image.url }}" class="card-img-top" style="height:250px; object-fit:cover;">

                    <div class="card-body d-flex flex-column">
                        <span class="badge bg-secondary mb-2">
                            {{ product.category.name }}
                        </span>

                        <h5>
                            <a href="{% url 'product_detail' product.id %}" class="text-decoration-none text-dark">
                                {{ product.name }}
                            </a>
                        </h5>

                        <p class="fw-bold text-success">
                            ${{ product.price }}
                        </p>

                        <a href="{% url 'add_to_cart' product.id %}" 
                           class="btn btn-primary mt-auto">
                           Add to Cart
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>

</div>

{% endblock %}
